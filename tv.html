:root{
  --deep:#152631; --navy:#2E4756; --teal:#38B3C2; --teal-d:#125A66; --gold:#D9A04B;
  --ok:#5FB58C; --mid:#E2AB55; --neg:#E27C6F; --plum:#A194DD; --nc:#7D929C;
  --txt:#EEF3F2; --mut:rgba(238,243,242,.66); --line:rgba(255,255,255,.13); --panel:rgba(255,255,255,.055);
  --f:"KVM Inter",Inter,"Segoe UI",Roboto,Arial,sans-serif; --fh:"KVM SG","Space Grotesk","KVM Inter",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--deep);overflow:hidden;cursor:none}
html.emb,html.emb body{cursor:auto}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--s,1));
  background:radial-gradient(120% 95% at 0% 0%,#2E4756 0%,#1E3341 55%,#152631 100%);color:var(--txt);font-family:var(--f);overflow:hidden;-webkit-font-smoothing:antialiased}
.progress{position:absolute;top:0;left:0;height:6px;width:0;background:var(--gold)}
header{position:absolute;top:0;left:0;right:0;height:140px;display:flex;align-items:center;gap:36px;padding:26px 72px 0}
header img{height:58px;display:block}
.sep{width:2px;height:68px;background:var(--line)}
.ttl .t1{font:500 24px var(--f);color:var(--mut)}
.ttl .t2{font:700 48px/1.1 var(--fh);letter-spacing:-.01em;margin-top:2px}
.clock{margin-left:auto;text-align:right}
.clock .h{font:700 66px/1 var(--fh);font-variant-numeric:tabular-nums}
.clock .d{font:500 23px var(--f);color:var(--mut);margin-top:6px}
.clock .d::first-letter{text-transform:uppercase}
main{position:absolute;top:168px;left:72px;right:72px;bottom:100px}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .8s ease}
.slide.on{opacity:1}
footer{position:absolute;left:72px;right:72px;bottom:30px;height:44px;display:flex;align-items:center;gap:24px;font:500 21px var(--f);color:var(--mut)}
.nav{margin-left:auto;display:flex;gap:28px}
.nav span{padding-bottom:6px;border-bottom:4px solid transparent}
.nav span.on{color:var(--txt);border-bottom-color:var(--gold);font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:26px}
h3{font:700 32px/1.15 var(--fh);margin:0}
.mut{color:var(--mut)}
.num{font-family:var(--fh);font-variant-numeric:tabular-nums}

/* visão geral */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);height:252px;padding:26px 0}
.kpi{padding:0 40px;border-left:2px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.kpi:first-child{border-left:0}
.kpi .v{font:700 100px/1 var(--fh);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .l{font:600 28px var(--f);margin-top:10px}
.kpi .s{font:500 22px var(--f);color:var(--mut);margin-top:4px}
.kpi .s b{font-weight:600}
.row1{display:grid;grid-template-columns:1.5fr 1fr;gap:32px;margin-top:32px;height:524px}
.row1 .panel{padding:30px 36px}
.leg{display:flex;gap:26px;font:500 21px var(--f);color:var(--mut);align-items:center}
.leg i{display:inline-block;width:16px;height:16px;border-radius:4px;margin-right:9px;vertical-align:-2px}
.hrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.tipo{display:grid;grid-template-columns:1fr auto;gap:10px 18px;align-items:end;margin-top:34px}
.tipo .tr{margin-bottom:14px}
.tipo .n{font:600 26px var(--f)}
.tipo .v{font:700 34px/1 var(--fh);text-align:right}
.tipo .v small{font:500 19px var(--f);color:var(--mid);margin-left:10px}
.tipo .tr{grid-column:1 / -1;height:14px;border-radius:7px;background:rgba(255,255,255,.08);overflow:hidden;display:flex}
.tipo .tr span{display:block;height:100%}

/* mapa */
.mapgrid{display:grid;grid-template-columns:1180px 1fr;gap:40px;height:100%}
.mapbox{position:relative;overflow:hidden;padding:0}
.mapbox svg{display:block;width:100%;height:100%}
.side{display:flex;flex-direction:column;gap:26px;min-width:0}
.big{font:700 120px/1 var(--fh);letter-spacing:-.02em}
.side .lbl{font:600 28px var(--f);margin-top:6px}
.mleg{display:flex;flex-direction:column;gap:12px;font:500 22px var(--f);color:var(--mut)}
.mleg i{display:inline-block;width:20px;height:20px;border-radius:50%;margin-right:12px;vertical-align:-3px}
.toplist{display:flex;flex-direction:column;gap:10px}
.toplist div{display:flex;justify-content:space-between;gap:16px;font:500 25px var(--f);border-bottom:1px solid var(--line);padding-bottom:9px}
.toplist div span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toplist div span:last-child{font:700 27px var(--fh)}
.fora{font:500 20px/1.45 var(--f);color:var(--mut)}

/* calendário */
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font:500 21px var(--f)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:calc(100% - 58px)}
.wd{font:600 23px var(--f);color:var(--mut);padding:0 12px;align-self:end}
.cel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-height:0;overflow:hidden}
.cel.fds{background:rgba(255,255,255,.03)}
.cel.fora{background:transparent;border-color:transparent}
.cel .dn{font:700 27px/1 var(--fh);color:var(--mut);width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:50%;margin:-4px 0 0 -6px}
.cel.tem .dn{color:var(--txt)}
.cel.fora .dn{opacity:.3}
.cel.hoje{border:3px solid var(--gold)}
.cel.hoje .dn{background:var(--gold);color:#1E3341}
.chip{--c:var(--ok);font:600 19px/1.2 var(--f);padding:4px 10px;border-radius:7px;border-left:5px solid var(--c);background:color-mix(in srgb,var(--c) 18%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.p{--c:var(--mid)}
.chip.x{--c:var(--nc)}
.chip.a{--c:var(--neg)}
.mais{font:500 18px var(--f);color:var(--mut);padding-left:4px}
.vazio{position:absolute;left:0;right:0;bottom:24px;text-align:center;font:500 24px var(--f);color:var(--mut)}

/* pendências */
.resumo{font:500 34px/1.3 var(--f);margin:0 0 26px}
.resumo b{font-family:var(--fh);font-weight:700;font-size:40px}
.resumo b.neg{color:var(--neg)}
.pgrid{display:grid;grid-template-columns:1.55fr 1fr;gap:36px;height:calc(100% - 72px)}
.plist{display:flex;flex-direction:column}
.pit{display:grid;grid-template-columns:104px 1fr auto;gap:22px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.pit:first-child{border-top:0;padding-top:0}
.pd{text-align:center;border-radius:14px;background:var(--panel);padding:8px 4px}
.pd .a{font:700 34px/1 var(--fh)}
.pd .b{font:500 18px var(--f);color:var(--mut);margin-top:2px}
.pd.late{background:color-mix(in srgb,var(--neg) 20%,transparent)}
.pd.late .a{color:var(--neg)}
.pit .t{font:600 27px/1.2 var(--f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pit .u{font:500 21px var(--f);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.bdg{font:600 19px var(--f);padding:6px 14px;border-radius:20px;white-space:nowrap}
.bdg.a{color:var(--neg);background:color-mix(in srgb,var(--neg) 18%,transparent)}
.bdg.p{color:var(--mid);background:color-mix(in srgb,var(--mid) 18%,transparent)}
.outras{font:500 21px var(--f);color:var(--mut);margin-top:10px}
.bars{display:flex;flex-direction:column;gap:20px;margin-top:22px}
.bar .h{display:flex;justify-content:space-between;font:600 24px var(--f);margin-bottom:8px}
.bar .h span:last-child{font:700 28px var(--fh)}
.bar .tr{height:14px;border-radius:7px;background:rgba(255,255,255,.08);overflow:hidden;display:flex}
.bar .tr span{display:block;height:100%}

/* salas */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 64px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 300px 150px;gap:22px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.srow .n{font:600 26px/1.2 var(--f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .p{font:500 19px var(--f);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .tr{height:16px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden;display:flex}
.srow .tr span{display:block;height:100%}
.srow .v{text-align:right;font:700 28px/1 var(--fh)}
.srow .v small{display:block;font:500 18px var(--f);color:var(--mut);margin-top:5px}
@media (prefers-reduced-motion:reduce){.slide{transition:none}}
</style>
</head>

const NS = 'http://www.w3.org/2000/svg';
const sv = (tag, attrs, txt) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (txt != null) e.textContent = txt; return e; };

/* escala para caber em qualquer tela 16:9 */
function escala() { document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1920, innerHeight / 1080)); }
addEventListener('resize', escala); escala();

/* relógio */
function relogio() {
  const d = new Date();
  $('#hora').textContent = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  $('#data').textContent = d.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
}
relogio(); setInterval(relogio, 10000);
$('#fonte').textContent = 'Bitrix e controle de salas, cronograma até ' + fmtD(D.k.ref) + ', status das pendentes conferido em 14/10/2026';

/* ---------- telas ---------- */
function telaVisao() {
  const s = el('section', 'slide');
  const k = D.k, pm = D.pm;
  const band = el('div', 'panel kpis');
  const kpi = (v, l, sub, cor, sub2) => { const c = el('div', 'kpi'); const vv = el('div', 'v', v); if (cor) vv.style.color = cor; c.append(vv, el('div', 'l', l)); if (sub) { const ss = el('div', 's'); ss.append(...sub); c.append(ss); } if (sub2) { const s2 = el('div', 's'); s2.append(...sub2); c.append(s2); } return c; };
  const b = (t, cor) => { const e = el('b', null, t); if (cor) e.style.color = cor; return e; };
  band.append(
    kpi(n(k.total), 'Tarefas no ano', ['de ' + pm[0].m + ' a ' + pm[pm.length - 1].m]),
    kpi(k.pct + '%', 'Concluídas', [b(n(k.conc)), ' de ' + n(k.total) + ' tarefas'], 'var(--ok)'),
    kpi(n(k.pend), 'Pendentes', [b(n(k.atras), 'var(--neg)'), ' com data passada'], 'var(--mid)', k.conf ? [b(n(k.conf)), ' a confirmar no Bitrix'] : null),
    kpi(n(k.clientes), 'Clientes atendidos', [b(n(k.locais)), ' locais']),
    kpi(n(k.salas), 'Salas no controle', ['em ', b(n(k.salas_cli)), ' clientes'])
  );
  const row = el('div', 'row1');
  /* barras por mês */
  const p1 = el('div', 'panel');
  const h1 = el('div', 'hrow'); h1.append(el('h3', null, 'Tarefas por mês de referência'));
  const lg = el('div', 'leg'); [['var(--ok)', 'Concluídas'], ['var(--mid)', 'Em aberto']].forEach(([c, t]) => { const sp = el('span'); const i = el('i'); i.style.background = c; sp.append(i, t); lg.append(sp); });
  h1.append(lg); p1.append(h1);
  const W = 1000, H = 420, ml = 10, mb = 44, mt = 44;
  const svg = sv('svg', { viewBox: '0 0 ' + W + ' ' + H, width: '100%', height: H });
  const max = Math.max(...pm.map((m) => m.c + m.p)) || 1;
  const bw = (W - ml) / pm.length; const lw = Math.min(78, bw * 0.62);
  const y = (v) => H - mb - v / max * (H - mb - mt);
  pm.forEach((m, i) => {
    const x = ml + i * bw + (bw - lw) / 2; const tot = m.c + m.p;
    svg.append(sv('rect', { x, y: y(m.c), width: lw, height: Math.max(0, y(0) - y(m.c)), rx: 6, fill: 'var(--ok)' }));
    if (m.p) svg.append(sv('rect', { x, y: y(tot), width: lw, height: Math.max(0, y(m.c) - y(tot)) + Math.min(6, y(0) - y(m.c)), rx: 6, fill: 'var(--mid)' }));
    svg.append(sv('text', { x: x + lw / 2, y: y(tot) - 12, 'text-anchor': 'middle', fill: 'var(--txt)', 'font-family': 'KVM SG, Arial', 'font-weight': 700, 'font-size': 28 }, n(tot)));
    svg.append(sv('text', { x: x + lw / 2, y: H - 10, 'text-anchor': 'middle', fill: 'var(--mut)', 'font-family': 'KVM Inter, Arial', 'font-weight': 500, 'font-size': 24 }, m.m));
  });
  svg.append(sv('line', { x1: 0, x2: W, y1: y(0) + 0.5, y2: y(0) + 0.5, stroke: 'rgba(255,255,255,.18)', 'stroke-width': 2 }));
  p1.append(svg);
  /* por tipo */
  const p2 = el('div', 'panel'); p2.append(el('h3', null, 'Por tipo de atividade'));
  const tp = el('div', 'tipo'); const mx = Math.max(...D.pt.map((t) => t.n));
  D.pt.forEach((t) => {
    tp.append(el('div', 'n', t.t));
    const v = el('div', 'v', n(t.n)); if (t.p) v.append(el('small', null, n(t.p) + ' em aberto')); tp.append(v);
    const tr = el('div', 'tr'); const a = el('span'); a.style.width = ((t.n - t.p) / mx * 100) + '%'; a.style.background = COR_TIPO[t.t] || 'var(--nc)';
    const bb = el('span'); bb.style.width = (t.p / mx * 100) + '%'; bb.style.background = COR_TIPO[t.t] || 'var(--nc)'; bb.style.opacity = '.45';
    tr.append(a, bb); tp.append(tr);
  });
  p2.append(tp);
  row.append(p1, p2);
  s.append(band, row);
  return { s, titulo: 'Visão geral', nome: 'Visão geral' };
}

function telaMapa() {
  const s = el('section', 'slide');
  const g = el('div', 'mapgrid');
  const box = el('div', 'panel mapbox');
  const M = D.map;
  const svg = sv('svg', { viewBox: '0 0 ' + M.w + ' ' + M.h, preserveAspectRatio: 'xMidYMid slice' });
  svg.append(sv('path', { d: M.mun, fill: 'rgba(255,255,255,.025)', stroke: 'rgba(255,255,255,.10)', 'stroke-width': 1, 'fill-rule': 'evenodd' }));
  svg.append(sv('path', { d: M.dist, fill: 'rgba(255,255,255,.06)', stroke: 'rgba(255,255,255,.15)', 'stroke-width': 0.8, 'fill-rule': 'evenodd' }));
  M.pts.forEach((p) => {
    svg.append(sv('circle', { cx: p.x, cy: p.y, r: 9, fill: p.o === 's' ? '#1E3341' : 'var(--teal)', stroke: p.o === 's' ? 'var(--teal)' : '#1E3341', 'stroke-width': p.o === 's' ? 3.5 : 2.5 }));
  });
  M.pts.forEach((p) => {
    if (!p.lab) return;
    svg.append(sv('text', { x: p.lab.x, y: p.lab.y, 'text-anchor': p.lab.a, fill: 'var(--txt)', 'font-family': 'KVM Inter, Arial', 'font-weight': 600, 'font-size': 18, stroke: '#1B2F3C', 'stroke-width': 5, 'paint-order': 'stroke', 'stroke-linejoin': 'round' }, p.l));
  });
  const I = M.inset;
  if (I) {
    const defs = sv('defs'); const clip = sv('clipPath', { id: 'recorte' });
    clip.append(sv('rect', { x: I.x, y: I.y + I.top, width: I.w, height: I.h - I.top }));
    defs.append(clip); svg.append(defs);
    svg.append(sv('rect', { x: I.rx, y: I.ry, width: I.rw, height: I.rh, rx: 4, fill: 'none', stroke: 'var(--gold)', 'stroke-width': 2, 'stroke-dasharray': '7 6' }));
    svg.append(sv('line', { x1: I.rx + I.rw, y1: I.ry + I.rh / 2, x2: I.x, y2: I.y + I.h / 2, stroke: 'var(--gold)', 'stroke-width': 2, 'stroke-dasharray': '7 6' }));
    svg.append(sv('rect', { x: I.x, y: I.y, width: I.w, height: I.h, rx: 16, fill: '#1B2F3C', stroke: 'var(--gold)', 'stroke-width': 2 }));
    svg.append(sv('text', { x: I.x + 18, y: I.y + 25, fill: 'var(--txt)', 'font-family': 'KVM Inter, Arial', 'font-weight': 600, 'font-size': 18 }, 'Ampliado: Pinheiros, Itaim e Vila Olímpia'));
    const gi = sv('g', { 'clip-path': 'url(#recorte)' });
    const gt = sv('g', { transform: 'translate(' + (I.x - I.rx * I.k) + ',' + (I.y + I.top - I.ry * I.k) + ') scale(' + I.k + ')' });
    gt.append(sv('path', { d: M.dist, fill: 'rgba(255,255,255,.07)', stroke: 'rgba(255,255,255,.2)', 'stroke-width': 1, 'vector-effect': 'non-scaling-stroke', 'fill-rule': 'evenodd' }));
    gi.append(gt);
    I.pts.forEach((p) => gi.append(sv('circle', { cx: p.x, cy: p.y, r: 8, fill: p.o === 's' ? '#1E3341' : 'var(--teal)', stroke: p.o === 's' ? 'var(--teal)' : '#1E3341', 'stroke-width': p.o === 's' ? 3 : 2 })));
    I.pts.forEach((p) => { if (p.lab) gi.append(sv('text', { x: p.lab.x, y: p.lab.y, 'text-anchor': p.lab.a, fill: 'var(--txt)', 'font-family': 'KVM Inter, Arial', 'font-weight': 600, 'font-size': 15, stroke: '#1B2F3C', 'stroke-width': 4, 'paint-order': 'stroke', 'stroke-linejoin': 'round' }, p.l)); });
    svg.append(gi);
  }
  box.append(svg);
  const side = el('div', 'side');
  const top = el('div'); top.append(el('div', 'big num', n(M.pts.length)), el('div', 'lbl', 'localidades no mapa'));
  const leg = el('div', 'mleg');
  [['var(--teal)', 'Endereço do Bitrix', false], ['#1E3341', 'Endereço da sede, pesquisado na internet', true]].forEach(([c, t, h]) => { const d = el('div'); const i = el('i'); i.style.background = c; if (h) i.style.boxShadow = 'inset 0 0 0 3.5px var(--teal)'; d.append(i, t); leg.append(d); });
  const tl = el('div'); tl.append(el('h3', null, 'Mais tarefas no ano'));
  const lst = el('div', 'toplist'); lst.style.marginTop = '14px';
  D.top.slice(0, 7).forEach(([l, v]) => { const d = el('div'); d.append(el('span', null, l), el('span', null, n(v))); lst.append(d); });
  tl.append(lst);
  const outras = D.fora.filter((f) => f.m);
  const fr = el('div', 'fora', 'Fora do mapa: ' + outras.map((f) => f.l + ' (' + f.m + ')').join(', ') + '.');
  side.append(top, leg, tl, fr);
  g.append(box, side); s.append(g);
  return { s, titulo: 'Mapa das localidades', nome: 'Mapa' };
}

function telaCalendario() {
  const s = el('section', 'slide');
  const hoje = new Date(); const ano = hoje.getFullYear(), mes = hoje.getMonth();
  const iso = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const hojeIso = iso(hoje);
  const head = el('div', 'calhead');
  const lg = el('div', 'leg'); [['var(--ok)', 'Concluída'], ['var(--mid)', 'Pendente'], ['var(--neg)', 'Pendente com data passada']].forEach(([c, t]) => { const sp = el('span'); const i = el('i'); i.style.background = c; sp.append(i, t); lg.append(sp); });
  head.append(lg, el('span', 'mut', 'Cronograma até ' + fmtD(D.k.ref)));
  s.append(head);
  const cal = el('div', 'cal');
  ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'].forEach((w) => cal.append(el('div', 'wd', w)));
  const prim = new Date(ano, mes, 1); const off = (prim.getDay() + 6) % 7; const dias = new Date(ano, mes + 1, 0).getDate();
  const total = Math.ceil((off + dias) / 7) * 7;
  const porDia = {}; D.tk.forEach((t) => { (porDia[t.d] ||= []).push(t); });
  let noMes = 0;
  cal.style.gridTemplateRows = '36px repeat(' + total / 7 + ',1fr)';
  for (let i = 0; i < total; i++) {
    const d = new Date(ano, mes, 1 - off + i); const dentro = d.getMonth() === mes; const ds = iso(d);
    const lista = dentro ? (porDia[ds] || []).slice().sort((a, b) => (a.h || '99').localeCompare(b.h || '99')) : [];
    noMes += lista.length;
    const c = el('div', 'cel' + (dentro ? '' : ' fora') + (i % 7 >= 5 ? ' fds' : '') + (lista.length ? ' tem' : '') + (ds === hojeIso ? ' hoje' : ''));
    c.append(el('div', 'dn', String(d.getDate())));
    const cap = total / 7 > 5 ? 2 : 3;
    const mostra = lista.length > cap ? cap - 1 : lista.length;
    lista.slice(0, mostra).forEach((t) => c.append(el('div', 'chip ' + t.s, t.l)));
    if (lista.length > mostra) c.append(el('div', 'mais', '+' + (lista.length - mostra) + ' ' + pl(lista.length - mostra, 'tarefa', 'tarefas')));
    cal.append(c);
  }
  s.append(cal);
  if (!noMes) s.append(el('div', 'vazio', 'Nenhuma tarefa deste mês no cronograma exportado.'));
  const nomeMes = prim.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  return { s, titulo: 'Agenda de ' + nomeMes, nome: 'Agenda' };
}

function telaPendencias() {
  const s = el('section', 'slide');
  const k = D.k;
  const r = el('p', 'resumo'); const b1 = el('b', null, n(k.pend)); const b2 = el('b', 'neg', n(k.atras));
  r.append(b1, ' ', pl(k.pend, 'pendente confirmada', 'pendentes confirmadas'), ' no Bitrix, ', b2, ' com data passada.');
  if (k.conf) { const b3 = el('b', null, n(k.conf)); r.append(' Outras ', b3, ' a confirmar.'); }
  s.append(r);
  const g = el('div', 'pgrid');
  const lst = el('div', 'plist');
  const max = 7;
  D.pl.slice(0, max).forEach((p) => {
    const it = el('div', 'pit');
    const d = dia(p.d); const pd = el('div', 'pd' + (p.a ? ' late' : ''));
    pd.append(el('div', 'a', d ? String(d.getDate()).padStart(2, '0') : '—'), el('div', 'b', d ? MES[d.getMonth()] + (p.h ? ' ' + p.h : '') : 'sem data'));
    const m = el('div'); m.style.minWidth = '0';
    m.append(el('div', 't', p.l), el('div', 'u', [p.t, p.tp].filter(Boolean).join(', ')));
    it.append(pd, m, el('span', 'bdg ' + (p.a ? 'a' : 'p'), p.a ? 'Data passada' : p.d ? 'Agendada' : 'Sem data'));
    lst.append(it);
  });
  if (D.pl.length > max) lst.append(el('div', 'outras', '+' + (D.pl.length - max) + ' ' + pl(D.pl.length - max, 'outra pendência', 'outras pendências') + ' no painel completo'));
  const side = el('div', 'panel'); side.style.padding = '30px 34px';
  side.append(el('h3', null, 'Por local'));
  const bars = el('div', 'bars'); const mx = Math.max(...D.ppl.map((x) => x[1])) || 1;
  D.ppl.forEach(([l, v, a]) => {
    const b = el('div', 'bar'); const h = el('div', 'h'); h.append(el('span', null, l), el('span', null, n(v)));
    const tr = el('div', 'tr'); const x1 = el('span'); x1.style.width = (a / mx * 100) + '%'; x1.style.background = 'var(--neg)';
    const x2 = el('span'); x2.style.width = ((v - a) / mx * 100) + '%'; x2.style.background = 'var(--mid)';
    tr.append(x1, x2); b.append(h, tr); bars.append(b);
  });
  side.append(bars);
  g.append(lst, side); s.append(g);
  return { s, titulo: 'Pendências', nome: 'Pendências' };
}

function telaSalas() {
  const s = el('section', 'slide');
  const k = D.k;
  const r = el('p', 'resumo'); r.append(el('b', null, n(k.salas)), ' salas em ', el('b', null, n(k.salas_cli)), ' clientes, com a cobertura da última preventiva registrada.');
  s.append(r);
  const lg = el('div', 'leg'); lg.style.marginBottom = '14px';
  [['var(--ok)', 'Na última preventiva'], ['var(--mid)', 'Fora da última preventiva'], ['var(--nc)', 'Sem relatório no controle']].forEach(([c, t]) => { const sp = el('span'); const i = el('i'); i.style.background = c; sp.append(i, t); lg.append(sp); });
  s.append(lg);
  const g = el('div', 'sgrid');
  const metade = Math.ceil(D.sl.length / 2);
  [D.sl.slice(0, metade), D.sl.slice(metade)].forEach((col) => {
    const c = el('div');
    col.forEach((x) => {
      const row = el('div', 'srow');
      const nm = el('div'); nm.style.minWidth = '0'; nm.append(el('div', 'n', x.l), el('div', 'p', x.pr || ' '));
      const tr = el('div', 'tr');
      [[x.u, 'var(--ok)'], [x.f, 'var(--mid)'], [x.r, 'var(--nc)']].forEach(([v, cor]) => { const sp = el('span'); sp.style.width = (v / x.s * 100) + '%'; sp.style.background = cor; tr.append(sp); });
      const v = el('div', 'v', x.u + ' de ' + x.s); v.append(el('small', null, x.d ? fmtD(x.d) : 'sem relatório'));
      row.append(nm, tr, v); c.append(row);
    });
    g.append(c);
  });
  s.append(g);
  return { s, titulo: 'Salas por cliente', nome: 'Salas' };
}

/* ---------- rotação ---------- */
const params = new URLSearchParams(location.search);
const DUR = Math.max(5, Number(params.get('tempo')) || 15) * 1000;
const CHAVES = { visao: telaVisao, mapa: telaMapa, agenda: telaCalendario, pendencias: telaPendencias, salas: telaSalas };
const fixa = params.get('tela');
const ordem = fixa && CHAVES[fixa] ? [fixa] : Object.keys(CHAVES);
const telas = ordem.map((c) => CHAVES[c]());
const main = $('#slides'); const nav = $('#nav');
telas.forEach((t) => { main.append(t.s); nav.append(el('span', null, t.nome)); });
const emb = window.self !== window.top;
if (emb) document.documentElement.classList.add('emb');
let atual = -1, timer = null, rodando = false;
function avisa() { if (emb) parent.postMessage({ tipo: 'kvm-tv', atual, nomes: telas.map((t) => t.nome), rodando }, '*'); }
function barra(anima) {
  const pr = $('#progress');
  if (telas.length < 2) { pr.style.width = '100%'; return; }
  pr.style.transition = 'none'; pr.style.width = '0'; void pr.offsetWidth;
  if (anima) { pr.style.transition = 'width ' + DUR + 'ms linear'; pr.style.width = '100%'; }
}
function mostra(i) {
  atual = ((i % telas.length) + telas.length) % telas.length;
  telas.forEach((t, j) => t.s.classList.toggle('on', j === atual));
  [...nav.children].forEach((e, j) => e.classList.toggle('on', j === atual));
  $('#titulo').textContent = telas[atual].titulo;
  barra(rodando); avisa();
}
function liga() { if (telas.length < 2) return; rodando = true; clearInterval(timer); timer = setInterval(() => mostra(atual + 1), DUR); barra(true); avisa(); }
function pausa() { rodando = false; clearInterval(timer); barra(false); avisa(); }
mostra(0); liga();
/* comandos vindos do app que embute esta tela */
addEventListener('message', (e) => {
  const m = e.data; if (!m || m.tipo !== 'kvm-tv-cmd') return;
  const seguir = () => { if (rodando) liga(); };
  if (m.acao === 'proxima') { mostra(atual + 1); seguir(); }
  else if (m.acao === 'anterior') { mostra(atual - 1); seguir(); }
  else if (m.acao === 'ir') { mostra(Number(m.i) || 0); seguir(); }
  else if (m.acao === 'pausar') pausa();
  else if (m.acao === 'tocar') liga();
  else if (m.acao === 'estado') avisa();
});
/* recarrega à meia-noite para atualizar a agenda do mês */
setInterval(() => { const d = new Date(); if (d.getHours() === 0 && d.getMinutes() === 0) location.reload(); }, 60000);
</script>
